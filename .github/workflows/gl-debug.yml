# TEMPORARY (scratch branch only): the gpu crate's tests on wgpu's GL backend (Mesa llvmpipe).
name: GL debug
on:
  push:
    branches: [scratch/gl-debug]
permissions:
  contents: read
jobs:
  gl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Mesa (GL only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 libgbm1 libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libgtk-3-dev
          sudo apt-get remove -y -qq mesa-vulkan-drivers || true
          ls /usr/share/vulkan/icd.d 2>/dev/null || true
      - uses: Swatinem/rust-cache@v2
      - name: gpu tests on GL
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          EC_GL_DEBUG: "1"
        run: |
          rustc --version
          cargo test -p effectcraft-gpu --locked backend_selection -- --nocapture 2>&1 | grep -E "adapter:|test result"
          set -o pipefail
          cargo test -p effectcraft-gpu --locked 2>&1 | tee gl.log
